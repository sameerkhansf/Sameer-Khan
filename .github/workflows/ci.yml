name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs for older commits on the same ref are canceled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate content (frontmatter schema + markdownlint + MDX compile)
        run: npm run validate:content
      - name: Check links in posts
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 4 --retry-wait-time 3 --accept 200..=206,403,429 --root-dir ${{ github.workspace }}/content --fallback-extensions mdx 'content/blog/**/*.mdx'
          fail: true
      - name: Build (MDX compile gate)
        run: npm run build
      - name: Agent-readiness tests (against production build)
        run: npm run test:agents:ci

  # GitHub-documented Dependabot automation: merge patch/minor bumps only
  # after the full gate job above passes; majors stay for human review.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
