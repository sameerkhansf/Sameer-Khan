name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs for older commits on the same ref are canceled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate content (frontmatter schema + markdownlint)
        run: npm run validate:content
      - name: Check links in posts
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --max-retries 4 --retry-wait-time 3 --accept 200..=206,403,429 'content/blog/**/*.mdx'
          fail: true
      - name: Build (MDX compile gate)
        run: npm run build

  # GitHub-documented Dependabot automation: merge patch/minor bumps only
  # after the full gate job above passes; majors stay for human review.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
