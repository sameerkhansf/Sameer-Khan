name: CI

on:
  push:
    branches: [main]
  pull_request:

# Serialize runs per ref: back-to-back merges raced the README commit-back
# step into rebase conflicts. Superseded runs for older commits are canceled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate content (frontmatter schema + markdownlint)
        run: npm run validate:content
      - name: Check links in posts
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --accept 200..=206,403,429 'content/blog/**/*.mdx'
          fail: true
      - name: Build (MDX compile gate)
        run: npm run build
      - name: Update README index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git pull --rebase --autostash origin main
          npx tsx scripts/update-readme.ts
      - name: Commit and push if README changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "README-bot"
          git diff --quiet -- README.md || (git add README.md && git commit -m "Updated README" && git push)

  # GitHub-documented Dependabot automation: merge patch/minor bumps only
  # after the full gate job above passes; majors stay for human review.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
