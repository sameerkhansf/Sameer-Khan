name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate content (frontmatter schema + markdownlint)
        run: npm run validate:content
      - name: Check links in posts
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --accept 200..=206,403,429 'content/blog/**/*.mdx'
          fail: true
      - name: Build (MDX compile gate)
        run: npm run build
      - name: Update README index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx tsx scripts/update-readme.ts
      - name: Commit and push if README changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "README-bot"
          git diff --quiet || (git add README.md && git commit -m "Updated README" && git pull --rebase origin main && git push)
