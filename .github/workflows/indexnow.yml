name: IndexNow
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: "https://samkhan.net/sitemap.xml"
          key: ${{ secrets.INDEXNOW_KEY }}
          # lastmod is the post date at 00:00 UTC and this runs the next morning,
          # so the default 1-day window never contained a new post (none since 09-02).
          since: 2
          since-unit: day
          failure-strategy: error
